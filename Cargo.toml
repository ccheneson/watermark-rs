[package]
name = "watermark-rs"
version = "0.1.0"
edition = "2024"

[dependencies]
image ={ version = "0.25", default-features = false, features = ["png"] }
imageproc = "0.25"
ab_glyph = "0.2"
anyhow = "1.0.103"
pdfium-render = "0.9.3"
rand = "0.10.2"
pdf-writer = "0.14.0"
miniz_oxide = "0.9.1"
clap = { version ="4.6.4", features = ["derive"]}
clap_derive = "4.6.4"
printpdf = { version = "0.12.5",  features = ["images", "png"] }
tracing = "0.1.44"
tracing-subscriber = "0.3.23"

[dev.dependencies]
rust-analyzer = "0.0.1"
